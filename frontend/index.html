<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>에너지 계량기</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/entry-client.tsx"></script>
    <script>
      // Fallback: if React fails to render (e.g. Vite dep stubs during cold
      // start), auto-reload until deps are ready.  This fires OUTSIDE React
      // so it works even when React itself is null/undefined.
      (function(){
        var K='__boot_reload', W=30000, M=8;
        function st(){try{return JSON.parse(sessionStorage.getItem(K))||{c:0,t:0}}catch(e){return{c:0,t:0}}}
        setTimeout(function(){
          if(window.__reactOk)return;
          var s=st(),c=(Date.now()-s.t>W)?0:s.c;
          if(c<M){sessionStorage.setItem(K,JSON.stringify({c:c+1,t:Date.now()}));location.reload()}
        },3000);
      })();
    </script>

    <style>
      #mvp-badge {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 20px;
        font-family: "Lato", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        line-height: 16px;
        text-decoration: none;
        box-shadow: 0 1px 1px rgba(51,51,51,.08), 0 6px 12px rgba(51,51,51,.12);
        opacity: 0.9;
        transition: opacity 0.2s, transform 0.2s;
        cursor: default;
        border: 1px solid rgba(0,0,0,0.05);
      }
      #mvp-badge:hover { 
        opacity: 1; 
        transform: translateY(-2px); /* 마우스 올리면 살짝 위로 뜸 */
      }
      @media print { #mvp-badge { display: none; } }
    </style>
    <div id="mvp-badge" style="background: var(--bg-menu, #ffffff); color: var(--fg-base, #212121);">
      <span style="color: #ff2882; font-size: 14px;">⚡</span>
      <span>Made by <strong>MVP그리드랩</strong></span>
    </div>

  </body>
</html>
